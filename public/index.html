<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commit Tracker</title>
<link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/thumbnails/068/205/777/small_2x/git-website-3d-icon-png.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="hero">
    <div class="hero-left">
      <div class="eyebrow">// class-commit-tracker</div>
      <h1>Commit Tracker</h1>
      <p class="sub">Daily GitHub activity, synced from your git repo to keep an eye on you all 🧿</p>
    </div>
    <div class="hero-right" id="configBadges">
      <!-- filled by app.js -->
    </div>
  </header>

  <section class="controls">
    <button id="trackBtn" class="btn-primary">Track today's commits</button>
    <button id="syncBtn" class="btn-secondary">Sync students from Sheet</button>
    <span id="trackStatus" class="track-status"></span>
    <div class="spacer"></div>
    <label class="filter-label">Section
      <select id="sectionFilter"><option value="all">All</option></select>
    </label>
  </section>

  <section class="stats" id="stats">
    <!-- filled by app.js -->
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Leaderboard</h2>
      <span class="panel-hint">ranked by all-time commits, per class/section</span>
    </div>
    <div class="leaderboard" id="leaderboard">
      <!-- filled by app.js -->
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Ledger</h2>
      <span class="panel-hint" id="ledgerRange"></span>
    </div>
    <div class="ledger-scroll">
      <table id="ledgerTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Commit Share By Section</h2>
    </div>
    <canvas id="trendChart" height="90"></canvas>
  </section>

  <footer class="foot">Enjoy Coding Someone is watching you 😁</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
